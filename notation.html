<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Swaralipi — Hindustani Classical Music Notation Editor by Tanmoy Flute. Compose, edit, save, import, and export notation sheets."
    />
    <title>Swaralipi — Notation Editor | Tanmoy Flute</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/notes.css" />
    <link rel="stylesheet" href="css/notation.css" />
  </head>
  <body class="notes-page">
    <header class="site-header">
      <div class="container nav-shell">
        <a class="brand" href="index.html">
          <span class="brand-mark">TANMOY</span>
          <span class="brand-sub">Flute</span>
        </a>

        <div style="display:flex; align-items:center; gap:1rem;">
          <div class="nav-dropdown" id="toolsDropdown">
            <button class="nav-dropdown-toggle" aria-haspopup="true" aria-expanded="false" id="toolsToggle">
              Tools <span class="dropdown-arrow" aria-hidden="true">▾</span>
            </button>
            <div class="nav-dropdown-menu" role="menu">
              <a href="notes.html" role="menuitem">
                <span class="dropdown-item-label">Palta Generator</span>
                <span class="dropdown-item-desc">Aroha &amp; Avaroha practice sheets</span>
              </a>
              <a href="notation.html" role="menuitem">
                <span class="dropdown-item-label">Notation Generator</span>
                <span class="dropdown-item-desc">Hindustani Classical Notation Editor</span>
              </a>
            </div>
          </div>
          <a class="notes-back-link" href="index.html">Back to Stage</a>
        </div>
      </div>
    </header>

    <main class="notes-main">
      <div id="swaralipiApp" class="swaralipi-app"></div>
    </main>

    <!-- Swaralipi Engine, Editor & Automated Test Suite -->
    <script src="js/swaralipi-engine.js"></script>
    <script src="js/swaralipi-editor.js"></script>
    <script src="js/swaralipi-tests.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Initialize Swaralipi Editor
        var appEl = document.getElementById("swaralipiApp");
        if (appEl && window.Swaralipi && window.Swaralipi.Editor) {
          window.swaralipiEditor = new window.Swaralipi.Editor(appEl);
        }

        // Tools Navigation Dropdown Toggle
        var toolsDropdown = document.getElementById("toolsDropdown");
        var toolsToggle = document.getElementById("toolsToggle");
        if (toolsDropdown && toolsToggle) {
          toolsToggle.addEventListener("click", function (e) {
            e.stopPropagation();
            var isOpen = toolsDropdown.classList.toggle("is-open");
            toolsToggle.setAttribute("aria-expanded", String(isOpen));
          });
          document.addEventListener("click", function (e) {
            if (!toolsDropdown.contains(e.target)) {
              toolsDropdown.classList.remove("is-open");
              toolsToggle.setAttribute("aria-expanded", "false");
            }
          });
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              toolsDropdown.classList.remove("is-open");
              toolsToggle.setAttribute("aria-expanded", "false");
            }
          });
        }
      });
    </script>
  </body>
</html>
