<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hindustani Classical Tabla Taal Engine by Tanmoy Flute. Minimalist visual beat counting, metronome and rhythm practice."
    />
    <title>Tabla Taal Engine | Tanmoy Flute</title>
    <!-- Google Fonts: Cormorant Garamond & Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/notes.css" />
    <link rel="stylesheet" href="css/tabla.css" />
  </head>
  <body class="notes-page">
    <!-- ── Global Site Header ─────────────────────────────────────────── -->
    <header class="site-header">
      <div class="container nav-shell">
        <a class="brand" href="index.html">
          <span class="brand-mark">TANMOY</span>
          <span class="brand-sub">Flute</span>
        </a>

        <div class="header-nav-actions">
          <div class="nav-dropdown" id="toolsDropdown">
            <button class="nav-dropdown-toggle" aria-haspopup="true" aria-expanded="false" id="toolsToggle">
              Tools <span class="dropdown-arrow" aria-hidden="true">▾</span>
            </button>
            <div class="nav-dropdown-menu" role="menu">
              <a href="notes.html" role="menuitem">
                <span class="dropdown-item-label">Palta Generator</span>
                <span class="dropdown-item-desc">Aroha &amp; Avaroha practice sheets</span>
              </a>
              <a href="notation.html" role="menuitem">
                <span class="dropdown-item-label">Notation Generator</span>
                <span class="dropdown-item-desc">Hindustani Classical Notation Editor</span>
              </a>
              <a href="tabla.html" role="menuitem">
                <span class="dropdown-item-label">Tabla Taal Engine</span>
                <span class="dropdown-item-desc">Rhythm accompaniment &amp; practice beats</span>
              </a>
            </div>
          </div>
          <a class="notes-back-link" href="index.html">Back to Stage</a>
        </div>
      </div>
    </header>

    <!-- ── Main Stage Area (Viewport Optimized, No Desktop Scroll) ─────── -->
    <main class="notes-main">
      <div class="taal-workspace" id="tablaTaalEngineApp">
        <!-- 1. Minimalist Compact Header -->
        <header class="engine-compact-header">
          <p class="eyebrow">Tools / Rhythm Studio</p>
          <h1 class="engine-main-title">Tabla <span>Taal Engine</span></h1>
          <p class="engine-subtitle">Hindustani Classical &bull; Metronome &bull; Laya</p>
        </header>

        <!-- 2. Diagnostic Status Notice -->
        <div id="taalStatusNotice" class="taal-status-notice" role="status" aria-live="polite"></div>

        <!-- 3. Horizontal Controls Section -->
        <section class="controls-section" aria-label="Taal and Tempo Controls">
          <div class="controls-row">
            <!-- Taal Selector -->
            <div class="taal-select-group">
              <label class="control-label" for="taalSelect">SELECT TAAL</label>
              <div class="select-wrapper">
                <select class="taal-dropdown" id="taalSelect" name="taalSelect" aria-label="Select Taal">
                  <option value="">Loading Taals...</option>
                </select>
                <span class="select-arrow" aria-hidden="true">&#9662;</span>
              </div>
            </div>

            <!-- Tempo Controls Cluster -->
            <div class="tempo-control-group">
              <label class="control-label" for="tempoInput">TEMPO</label>
              <div class="tempo-controls-cluster">
                <div class="tempo-input-box">
                  <input
                    type="number"
                    class="tempo-input"
                    id="tempoInput"
                    name="tempoInput"
                    value="80"
                    min="20"
                    max="300"
                    step="1"
                    aria-label="Tempo in BPM"
                  />
                  <div class="tempo-steppers" aria-hidden="true">
                    <button type="button" class="stepper-arrow-btn" id="btnStepperUp" tabindex="-1" aria-label="Increase tempo">&#9650;</button>
                    <button type="button" class="stepper-arrow-btn" id="btnStepperDown" tabindex="-1" aria-label="Decrease tempo">&#9660;</button>
                  </div>
                  <span class="tempo-unit-badge">BPM</span>
                </div>
                <button
                  type="button"
                  class="tempo-btn-multiplier"
                  id="btnHalveTempo"
                  aria-label="Halve Tempo"
                  title="Halve Tempo (÷2)"
                >
                  &divide;2
                </button>
                <button
                  type="button"
                  class="tempo-btn-multiplier"
                  id="btnDoubleTempo"
                  aria-label="Double Tempo"
                  title="Double Tempo (×2)"
                >
                  &times;2
                </button>
              </div>
            </div>

            <!-- Playback Controls Cluster (Unified Row) -->
            <div class="playback-controls-group">
              <label class="control-label">PLAYBACK</label>
              <div class="playback-buttons-cluster">
                <button type="button" class="btn-play" id="btnPlay" aria-label="Play Taal" aria-pressed="false">
                  <span class="btn-icon" aria-hidden="true">
                    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                      <path d="M4 2.5L13.5 8L4 13.5V2.5Z" />
                    </svg>
                  </span>
                  <span class="btn-label">PLAY</span>
                </button>
                <button type="button" class="btn-stop-now" id="btnStopNow" aria-label="Stop Now" disabled>
                  <span class="btn-icon" aria-hidden="true">
                    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                      <rect x="3" y="3" width="10" height="10" rx="1.5" />
                    </svg>
                  </span>
                  <span class="btn-label">STOP NOW</span>
                </button>
                <button type="button" class="btn-stop-cycle" id="btnStopCycle" aria-label="Stop After Cycle" disabled>
                  <span class="btn-icon" aria-hidden="true">
                    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                      <path d="M2.5 3L9.5 8L2.5 13V3Z" />
                      <rect x="11.5" y="3" width="2" height="10" rx="0.5" />
                    </svg>
                  </span>
                  <span class="btn-label">STOP AFTER CYCLE</span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- 4. Compact Playback Information Strip -->
        <div id="playbackInfoBar" class="playback-info-bar" role="status" aria-live="polite"></div>

        <!-- 5. Main Beat Grid Display (Full Width, Large Notation) -->
        <section class="beat-display-section" aria-label="Beat Counting Display">
          <div class="beat-grid" id="beatGrid" role="region" aria-label="Beat Grid">
            <!-- Beat cells rendered dynamically by js/taal-renderer.js -->
          </div>
        </section>
      </div>
    </main>

    <!-- ── JavaScript Modules ─────────────────────────────────────────── -->
    <script src="tabla-taal-engine/js/audio-engine.js"></script>
    <script src="tabla-taal-engine/js/taal-loader.js"></script>
    <script src="tabla-taal-engine/js/taal-renderer.js"></script>
    <script src="tabla-taal-engine/js/metronome-engine.js"></script>
    <script src="tabla-taal-engine/js/app.js"></script>

    <!-- Global Nav Dropdown Interaction -->
    <script>
      (function () {
        var toolsDropdown = document.getElementById("toolsDropdown");
        var toolsToggle = document.getElementById("toolsToggle");
        if (toolsDropdown && toolsToggle) {
          toolsToggle.addEventListener("click", function (e) {
            e.stopPropagation();
            var isOpen = toolsDropdown.classList.toggle("is-open");
            toolsToggle.setAttribute("aria-expanded", String(isOpen));
          });
          document.addEventListener("click", function (e) {
            if (!toolsDropdown.contains(e.target)) {
              toolsDropdown.classList.remove("is-open");
              toolsToggle.setAttribute("aria-expanded", "false");
            }
          });
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              toolsDropdown.classList.remove("is-open");
              toolsToggle.setAttribute("aria-expanded", "false");
            }
          });
        }
      })();
    </script>
  
<script>
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    const list = [];
    document.querySelectorAll('*').forEach(el => {
      if (el.scrollWidth > 430) {
        list.push({
          tag: el.tagName,
          cls: el.className,
          id: el.id,
          scrollWidth: el.scrollWidth,
          clientWidth: el.clientWidth,
          offsetWidth: el.offsetWidth
        });
      }
    });
    console.error('SCROLL_WIDTH_OVERFLOW:' + JSON.stringify(list));
  }, 1000);
});
</script>
</body>
</html>
